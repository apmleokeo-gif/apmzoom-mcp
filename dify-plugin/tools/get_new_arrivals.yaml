identity:
  name: get_new_arrivals
  author: apmzoom
  label:
    en_US: New arrivals
    zh_Hans: 新品上架
    ja_JP: 新着商品
description:
  human:
    en_US: List the newest items uploaded by Dongdaemun stalls in the last N hours (up to 168), optionally by building and category.
    zh_Hans: 列出东大门档口最近 N 小时（最多 168）内上传的最新商品，可按楼栋和品类筛选。
    ja_JP: 東大門の店舗が直近 N 時間（最大 168）にアップロードした新着商品を、ビルやカテゴリで絞り込んで一覧します。
  llm: 'List the newest wholesale items uploaded by Dongdaemun (Seoul) stalls on apMZoomAI (앱엠줌AI) within the last N hours (default 24, up to 168), newest first, at most 3 per stall. Optional filters: building key (see list_buildings) and category (e.g. dress, knit, jeans, outer, shoes, bags). Returns item name, photos, category, stall location and an apMZoomAI link. No prices are provided; the link shows price and ordering details.'
parameters:
- name: hours
  type: number
  required: false
  default: 24
  min: 1
  max: 168
  label:
    en_US: Look-back hours
    zh_Hans: 回溯小时数
    ja_JP: 遡る時間
  human_description:
    en_US: Only items uploaded within this many hours (1-168, default 24)
    zh_Hans: 仅显示这么多小时内上传的商品（1-168，默认 24）
    ja_JP: この時間以内にアップロードされた商品のみ（1〜168、既定 24）
  llm_description: Look back this many hours (1-168, default 24).
  form: llm
- name: building
  type: string
  required: false
  label:
    en_US: Building
    zh_Hans: 楼栋
    ja_JP: ビル
  human_description:
    en_US: Only this building; use a building key from "List buildings", e.g. apM, THEOT, NUZZON
    zh_Hans: 仅限该楼栋；使用“列出楼栋”返回的楼栋代号，例如 apM、THEOT、NUZZON
    ja_JP: このビルのみ。「ビル一覧」で返るビルキー（例：apM、THEOT、NUZZON）を指定
  llm_description: Only this building, e.g. "apM", "THEOT", "NUZZON". Use a building key returned by list_buildings.
  form: llm
- name: category
  type: select
  required: false
  label:
    en_US: Category
    zh_Hans: 品类
    ja_JP: カテゴリ
  human_description:
    en_US: Only this category, e.g. dress, knit, jeans, outer, shoes, bags
    zh_Hans: 仅限该品类，例如 dress、knit、jeans、outer、shoes、bags
    ja_JP: このカテゴリのみ（例：dress、knit、jeans、outer、shoes、bags）
  llm_description: Only this category, e.g. dress, knit, jeans, outer, shoes, bags.
